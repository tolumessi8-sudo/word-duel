name: Build Android AAB (Play Store release)

# Manual only. Builds a signed release AAB (and a release APK) with real AdMob ads.
# Put your ids in repo variables/secrets (see PLAYSTORE.md). Without a keystore secret it
# signs with a throwaway key so the build can be checked, but Play will need your real upload key.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to players"
        default: "1.0.0"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  ADMOB_PLUGIN_REF: "4dc91441c4baa185a237a6b9156fb8ffff9a7524"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and the Android export templates (with the Gradle source template)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -oj -q /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" -d "$T"
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          ls -la "$T"

      - name: Android SDK parts and debug keystore
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          mkdir -p ~/.local/share/godot/keystores
          keytool -genkeypair -keystore ~/.local/share/godot/keystores/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the AdMob Android library from source
        run: |
          set -euo pipefail
          git clone https://github.com/poingstudios/godot-admob-plugin "$RUNNER_TEMP/admob"
          cd "$RUNNER_TEMP/admob"
          git checkout "$ADMOB_PLUGIN_REF"
          cd platforms/android
          chmod +x ./scripts/unix/download_godot.sh ./gradlew
          ./scripts/unix/download_godot.sh "$GODOT_VERSION"
          ./gradlew build -PgodotVersion="$GODOT_VERSION" --parallel
          ./gradlew zipPlugins -PgodotVersion="$GODOT_VERSION" --parallel
          ls -la .output

      - name: Add the AdMob addon, Android build template and real-ads code to the project
        env:
          APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
          BANNER: ${{ vars.ADMOB_BANNER }}
          INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL }}
          REWARDED: ${{ vars.ADMOB_REWARDED }}
        run: |
          set -euo pipefail
          ADM="$RUNNER_TEMP/admob/platforms"
          mkdir -p addons
          cp -r "$ADM/godot_editor/addons/admob" addons/admob
          mkdir -p addons/admob/android/bin
          unzip -q -o "$ADM/android/.output/android-template-v${GODOT_VERSION}.zip" -d addons/admob/android/bin
          cp ads_native/ads_admob.gd scripts/ads_admob.gd
          [ -n "$APP_ID" ] && sed -i "s|^const ADMOB_APP_ID := .*|const ADMOB_APP_ID := \"$APP_ID\"|" scripts/config.gd
          [ -n "$BANNER" ] && sed -i "s|^const ADMOB_BANNER := .*|const ADMOB_BANNER := \"$BANNER\"|" scripts/config.gd
          [ -n "$INTERSTITIAL" ] && sed -i "s|^const ADMOB_INTERSTITIAL := .*|const ADMOB_INTERSTITIAL := \"$INTERSTITIAL\"|" scripts/config.gd
          [ -n "$REWARDED" ] && sed -i "s|^const ADMOB_REWARDED := .*|const ADMOB_REWARDED := \"$REWARDED\"|" scripts/config.gd
          true
          # Android Gradle build template
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          # enable the editor plugin + AdMob settings (Google test app id)
          python3 - <<'PY'
          import os
          p = open("project.godot").read()
          p += '''
          [editor_plugins]

          enabled=PackedStringArray("res://addons/admob/plugin.cfg")

          [admob]

          general/android/enabled=true
          general/android/app_id="@APPID@"
          '''.replace("\n          ", "\n").replace("@APPID@", os.environ["APP_ID"])
          open("project.godot", "w").write(p)
          e = open("export_presets.cfg").read()
          e = e.replace("gradle_build/use_gradle_build=false", "gradle_build/use_gradle_build=true")
          e = e.replace('gradle_build/min_sdk=""', 'gradle_build/min_sdk="24"')
          e = e.replace('gradle_build/target_sdk=""', 'gradle_build/target_sdk="35"')
          e = e.replace("gradle_build/export_format=0", "gradle_build/export_format=1")
          e = e.replace('export_path="build/word-duel.apk"', 'export_path="build/word-duel.aab"')
          open("export_presets.cfg", "w").write(e)
          PY
          tail -12 project.godot

      - name: Import the project
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import 2>&1 | tail -30

      - name: Version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${{ inputs.version_name }}\"/" export_presets.cfg

      - name: Release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"; echo "KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNED=real" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret set - signing with a THROWAWAY key. Not uploadable as your real upload key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass throwaway -keypass throwaway -dname "CN=Throwaway,O=Word Duel,C=US"
            echo "KEY_ALIAS=throwaway" >> "$GITHUB_ENV"; echo "KEY_PASS=throwaway" >> "$GITHUB_ENV"
            echo "SIGNED=throwaway" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$(grep -m1 KEY_ALIAS $GITHUB_ENV | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$(grep -m1 KEY_PASS $GITHUB_ENV | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Export release AAB (Gradle)
        run: |
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Android" build/word-duel.aab 2>&1 | tail -60
          ls -la build
          test -s build/word-duel.aab
          jarsigner -verify build/word-duel.aab | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: word-duel-release-aab
          path: build/*.aab

      - name: Publish to the "play-release" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play-release --yes --cleanup-tag || true
          gh release create play-release build/*.aab \
            --title "Word Duel - Play Store AAB" \
            --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Signed with: ${SIGNED}. Upload this .aab in Play Console." \
            --prerelease --target "$GITHUB_SHA"
