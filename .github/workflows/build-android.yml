name: Build Android APK

# Builds the game in GitHub's cloud and publishes the APK under "Releases" (tag: latest)
# and as a workflow artifact. Runs on every push to main, or press "Run workflow" manually.

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and the Android export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -oj -q /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$T"
          ls -la "$T"

      - name: Prepare Android SDK parts and the debug keystore
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.1"
          mkdir -p ~/.local/share/godot/keystores
          keytool -genkeypair -keystore ~/.local/share/godot/keystores/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import the project
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: Run the game tests (headless, against a mock server)
        continue-on-error: true
        run: |
          python3 tests/mock_server.py "$PWD" &
          MOCK_PID=$!
          sleep 2
          timeout 240 "$GODOT" --headless --path . -s tests/ui_test.gd 2>&1 | grep -E "PASS|FAIL|DONE|ERROR" | tee test-output.txt
          kill $MOCK_PID || true
          grep -q "DONE fails=0" test-output.txt

      - name: Set version code
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          "$GODOT" --headless --path . --export-debug "Android" build/word-duel-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/word-duel-debug.apk
          ls -la build

      - name: Export signed release APK (only if signing secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No release keystore secrets set - skipping."; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          "$GODOT" --headless --path . --export-release "Android" build/word-duel-release.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/word-duel-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: word-duel-apk
          path: build/*.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.apk \
            --title "Word Duel - latest build" \
            --notes "Built from commit ${GITHUB_SHA::7} (build #${{ github.run_number }}). The debug APK is for testing on your phone." \
            --prerelease --target "$GITHUB_SHA"
